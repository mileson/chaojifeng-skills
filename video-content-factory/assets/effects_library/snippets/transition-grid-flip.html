<!--
模式：格子翻转转场（grid flip）【参数化框架】
适用场景：强调"切换视角/进入警示"的章节转场。屏幕分成 MxN 格子依次 3D 翻入盖屏 →
  文字 → 反向翻出揭开。机械感、科技感强，适合"注意/前提/规则"类警示章节。
框架参数：
  - 格子数：6x3=18 默认；4x2 更大块更慢重，8x4 更细腻（格子越多 stagger each 越小）
  - stagger from: "start"（左上扫到右下）/ "center"（中心爆开）/ "random"（乱序闪入）
  - 格子颜色 + border 色（border 用主题色低透明度，亮出网格质感）
  - 时长建议 2.0~2.6s
技术要点：
  - 格子用 JS 动态生成：display:grid + repeat(6,1fr)/repeat(3,1fr)，省得手写 18 个 div
  - rotationY 92→0 + transformPerspective: 900（每格独立透视，不需要父级 perspective）
  - 翻入 transformOrigin "left center" + from "start"；翻出 "right center" + from "end"（方向呼应）
  - stagger 用 grid: [rows, cols] 配置，GSAP 自动按二维距离排序
  - beat 容器 data-layout-allow-overflow，格子容器 data-layout-ignore
-->
<style>
  #gf-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); }
  .gf-cell { background: #0a0e18; border: 1px solid rgba(255,178,36,.08); will-change: transform; }
  #gf-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  #gf-small { color: #e5484d; font-size: 28px; font-weight: 800; letter-spacing: 12px; text-shadow: 0 0 16px rgba(229,72,77,.55); }
  #gf-big { color: #fff; font-size: 80px; font-weight: 900; letter-spacing: 4px; }
</style>

<!-- beat 容器需加 data-layout-allow-overflow -->
<div id="gf-grid" data-layout-ignore></div>
<div id="gf-center">
  <div id="gf-small">【⚠ WARNING · 注意】</div>
  <div id="gf-big">【章节文案】</div>
</div>

<script>
  const grid = document.getElementById("gf-grid");
  for (let i = 0; i < 18; i++) { const c = document.createElement("div"); c.className = "gf-cell"; grid.appendChild(c); }

  const b = gsap.timeline();
  b.from(".gf-cell", { rotationY: 92, autoAlpha: 0, transformPerspective: 900, transformOrigin: "left center",
      duration: 0.45, ease: "power2.out", stagger: { grid: [3, 6], from: "start", each: 0.035 } }, 0)
   .from("#gf-small", { y: 24, autoAlpha: 0, duration: 0.35, ease: "power3.out" }, 0.65)
   .from("#gf-big", { y: 44, autoAlpha: 0, duration: 0.45, ease: "power4.out" }, 0.75)
   .to("#gf-center", { autoAlpha: 0, scale: 0.97, duration: 0.25, ease: "power2.in" }, 1.5)
   .to(".gf-cell", { rotationY: -92, autoAlpha: 0, transformOrigin: "right center",
      duration: 0.4, ease: "power2.in", stagger: { grid: [3, 6], from: "end", each: 0.03 } }, 1.6);
</script>
