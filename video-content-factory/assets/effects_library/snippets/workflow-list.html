<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>workflow-list</title>
<!--
模式：流程清单（逐项弹出）
适用：罗列工作流步骤、功能清单，配合口播逐项强调
可替换字段：
  .wf-item     每个清单项的文案
  主色/背景色  可替换
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1a1a;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 1920px; height: 1080px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
  }
  .wf-item {
    display: flex; align-items: center; gap: 28px;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 26px 52px;
    min-width: 760px;
    font-size: 56px; font-weight: 800;
    color: #fff;
    box-shadow: 0 14px 40px rgba(0,0,0,0.25);
    opacity: 0;
  }
  .wf-dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: #30a46c; flex: none;
    box-shadow: 0 0 0 8px rgba(48,164,108,0.25);
  }
  .wf-item.active { background: rgba(48,164,108,0.22); border-color: rgba(48,164,108,0.55); }
</style>
</head>
<body>
<div id="stage">
  <div class="wf-item"><span class="wf-dot"></span><span>选题</span></div>
  <div class="wf-item"><span class="wf-dot"></span><span>写稿</span></div>
  <div class="wf-item"><span class="wf-dot"></span><span>录制</span></div>
  <div class="wf-item"><span class="wf-dot"></span><span>剪辑</span></div>
  <div class="wf-item"><span class="wf-dot"></span><span>特效</span></div>
  <div class="wf-item"><span class="wf-dot"></span><span>字幕</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  const PLAY = 6.5;
  const BEAT = 5.5;
  const repeats = Math.max(1, Math.floor(PLAY / BEAT));
  const tl = gsap.timeline({ repeat: repeats, repeatDelay: 0.4 });

  const items = document.querySelectorAll(".wf-item");
  const step = 0.55;
  items.forEach((el, i) => {
    tl.fromTo(el,
      { x: -120, autoAlpha: 0, scale: 0.9 },
      { x: 0, autoAlpha: 1, scale: 1, duration: 0.55, ease: "back.out(1.4)" },
      0.15 + i * step
    );
    tl.to(el, { className: "+=active", duration: 0.05 }, 0.15 + i * step + 0.5);
  });

  tl.to("#stage", { autoAlpha: 0, duration: 0.55, ease: "power2.in" }, BEAT - 0.55);
</script>
</body>
</html>
