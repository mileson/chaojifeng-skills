<!--
模式：数字倒计时转场（countdown 3-2-1）【参数化框架】
适用场景：预告下一段内容（"3·2·1 上规则"、"更多玩法马上来"），制造期待感。
  覆盖式设计（rgba 0.8 暗化）——底层画面隐约可见，倒计时是"预告"而不是"打断"。
框架参数：
  - 数字个数：3-2-1 默认；可 5 起跳（每个数字节拍 0.6s，总时长 = 数字数 x 0.6 + 0.7）
  - 圆环颜色 / 数字字号（170px 默认）/ 底部小字预告文案
  - 全屏接管版：bg 改不透明即可
技术要点：
  - 数字都绝对定位在同一个圆心容器内（visibility:hidden 初始），逐个 autoAlpha+scale 入出
  - 每个数字节拍：scale 1.7→1 弹入（0.22s）→ 停 0.2s → scale→0.8 收走（0.16s）
  - SVG 圆环每个数字期间跑一整圈：stroke-dashoffset C→0，ease "none"（匀速才像秒表）
  - 圆环 svg 要 rotate(-90deg) 让起点在 12 点钟方向
  - 数字切换节奏 0.6s/个 比真实 1s/个 更适合视频节奏（口播不等人）
-->
<style>
  #cd-bg { position: absolute; inset: 0; background: rgba(5, 8, 14, 0.8); }
  #cd-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #cd-ringbox { position: relative; width: 300px; height: 300px; }
  #cd-ringbox svg { transform: rotate(-90deg); }
  #cd-ring { fill: none; stroke: #ffb224; stroke-width: 8; stroke-linecap: round;
    filter: drop-shadow(0 0 12px rgba(255,178,36,.6)); }
  #cd-ring-track { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 8; }
  .cd-digit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 170px; font-weight: 900; text-shadow: 0 0 40px rgba(255,178,36,.4); visibility: hidden; }
  #cd-cap { color: #ffd58a; font-size: 30px; font-weight: 800; letter-spacing: 8px;
    text-shadow: 0 0 14px rgba(255,178,36,.5); }
</style>

<!-- beat 容器需加 data-layout-allow-overflow -->
<div id="cd-bg"></div>
<div id="cd-center">
  <div id="cd-ringbox">
    <svg width="300" height="300" viewBox="0 0 300 300">
      <circle id="cd-ring-track" cx="150" cy="150" r="130"></circle>
      <circle id="cd-ring" cx="150" cy="150" r="130"></circle>
    </svg>
    <div class="cd-digit" id="cd-d3">3</div>
    <div class="cd-digit" id="cd-d2">2</div>
    <div class="cd-digit" id="cd-d1">1</div>
  </div>
  <div id="cd-cap">【预告文案】</div>
</div>

<script>
  const b = gsap.timeline();
  const C = 2 * Math.PI * 130;
  gsap.set("#cd-ring", { attr: { "stroke-dasharray": C } });
  const digit = (sel, at) => {
    b.fromTo(sel, { autoAlpha: 0, scale: 1.7 }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power3.out" }, at)
     .to(sel, { autoAlpha: 0, scale: 0.8, duration: 0.16, ease: "power2.in" }, at + 0.42);
    b.fromTo("#cd-ring", { attr: { "stroke-dashoffset": C } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "none" }, at);
  };
  b.from("#cd-bg", { autoAlpha: 0, duration: 0.3, ease: "power1.inOut" }, 0)
   .from("#cd-cap", { y: 24, autoAlpha: 0, duration: 0.35, ease: "power3.out" }, 0.15);
  digit("#cd-d3", 0.3); digit("#cd-d2", 0.9); digit("#cd-d1", 1.5);
  b.to("#cd-center", { autoAlpha: 0, scale: 0.96, duration: 0.25, ease: "power2.in" }, 1.85)
   .to("#cd-bg", { autoAlpha: 0, duration: 0.3, ease: "power1.inOut" }, 1.9);
</script>
