<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>countup-price</title>
<!--
模式：数字滚动印章（count-up）
适用：价格/数据结论的弹出强调——数字从 0 滚到终值，比直接淡入终值质感高一档
可替换字段：
  price.v 的终值        需要 count-up 到的数字
  #price-num 前缀       当前为 "¥"，可改为 "$ / % / ×" 等
  #price-stamp small    单位/说明文案
  #price-stamp 背景色   当前为绿色 #30a46c，可按语义替换
要点：容器必须 tabular-nums 防数字宽度跳动；hyperframes 逐帧渲染下 onUpdate 所见即所得
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1a1a;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 1920px; height: 1080px;
  }
  #price-stamp {
    position: absolute; top: 360px; left: 50%;
    transform: translateX(-50%) rotate(3.5deg);
    background: #30a46c; color: #fff;
    font-weight: 900; font-size: 128px; padding: 32px 68px;
    border-radius: 22px;
    box-shadow: 0 18px 52px rgba(16, 24, 40, 0.32);
    font-variant-numeric: tabular-nums;
    text-align: center; white-space: nowrap;
    will-change: transform;
  }
  #price-stamp small {
    display: block; font-size: 38px; font-weight: 700;
    opacity: 0.92; margin-top: 6px; letter-spacing: 6px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="price-stamp"><span id="price-num">¥0.0</span><small>单 次 成 本</small></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  const PLAY = 5.0;
  const BEAT = 4.0;
  const repeats = Math.max(1, Math.floor(PLAY / BEAT));

  const tl = gsap.timeline({ repeat: repeats, repeatDelay: 0.3 });

  const price = { v: 0 };
  const target = 0.27;               // 终值：按项目需求替换
  const prefix = "¥";                // 前缀：按项目需求替换

  tl.from("#price-stamp", { scale: 0.2, autoAlpha: 0, rotation: 18, duration: 0.65, ease: "elastic.out(1, 0.55)" }, 0)
    .to(price, {
      v: target, duration: 1.1, ease: "power2.out",
      onUpdate() {
        document.querySelector("#price-num").textContent = prefix + price.v.toFixed(2);
      }
    }, 0.15)
    .to("#price-stamp", { scale: 1.06, duration: 0.24, ease: "power1.inOut", repeat: 3, yoyo: true }, 1.1)
    .to("#price-stamp", { y: -120, autoAlpha: 0, duration: 0.4, ease: "power2.in" }, BEAT - 0.45);
</script>
</body>
</html>
