<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ofe-bg { position: absolute; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #18243a 0%, #0b111e 58%, #070b14 100%); }
  #ofe-left { position: absolute; left: 200px; top: 50%; transform: translateY(-50%); width: 600px; }
  #ofe-avatar { width: 168px; height: 168px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 72px; font-weight: 900; color: #fff;
    background: linear-gradient(135deg, #3e9eff, #4dd0e1); border: 4px solid rgba(255,255,255,.25);
    box-shadow: 0 20px 60px rgba(62,158,255,.35); }
  #ofe-name { color: #f4f7ff; font-size: 52px; font-weight: 900; margin-top: 30px; }
  #ofe-sub { color: #9aa6ba; font-size: 24px; font-weight: 700; margin-top: 12px; }
  #ofe-btn { position: relative; display: inline-flex; align-items: center; gap: 12px; margin-top: 36px;
    color: #fff; font-size: 30px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, #e5484d, #ff6b6b); border-radius: 99px; padding: 18px 56px;
    box-shadow: 0 14px 40px rgba(229,72,77,.4); }
  #ofe-ring { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; border-radius: 99px;
    border: 3px solid #ff8a8a; transform: translate(-50%, -50%); opacity: 0; }
  #ofe-right { position: absolute; right: 200px; top: 50%; transform: translateY(-50%); width: 660px; }
  #ofe-next-label { color: #4dd0e1; font-size: 22px; font-weight: 800; letter-spacing: 6px; }
  #ofe-card { margin-top: 18px; width: 660px; height: 371px; border-radius: 22px; position: relative;
    background: linear-gradient(150deg, #1c2742 0%, #11182a 100%); overflow: hidden;
    border: 1px solid rgba(255,255,255,.14); box-shadow: 0 24px 70px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; }
  #ofe-play { width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,.14);
    border: 2px solid rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; }
  #ofe-play::after { content: ""; border-left: 30px solid #fff; border-top: 18px solid transparent;
    border-bottom: 18px solid transparent; margin-left: 8px; }
  #ofe-next-title { color: #dde5f2; font-size: 28px; font-weight: 800; margin-top: 20px; }


</style>
</head>
<body>
<div id="stage">
<div id="ofe-bg" data-layout-allow-overflow></div>
<div id="ofe-left">
  <div id="ofe-avatar">峰</div>
  <div id="ofe-name">超级峰</div>
  <div id="ofe-sub">AI 独立开发者 · 一个人 + AI 把想法做成产品</div>
  <div id="ofe-btn"><span id="ofe-btn-text">+ 关注</span><div id="ofe-ring" data-layout-ignore></div></div>
</div>
<div id="ofe-right">
  <div id="ofe-next-label">NEXT EPISODE · 下期预告</div>
  <div id="ofe-card"><div id="ofe-play"></div></div>
  <div id="ofe-next-title">把 Agent 接进飞书：10 分钟搭一个自动周报机器人</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  tl.from("#ofe-bg", { autoAlpha: 0, duration: 0.6 }, t0);
  tl.from("#ofe-avatar", { autoAlpha: 0, scale: 0.4, duration: 0.6, ease: "back.out(1.8)" }, t0 + 0.4);
  tl.from(["#ofe-name", "#ofe-sub", "#ofe-btn"], { autoAlpha: 0, y: 26, duration: 0.5, stagger: 0.14 }, t0 + 0.6);
  tl.from(["#ofe-next-label", "#ofe-card", "#ofe-next-title"], { autoAlpha: 0, x: 60, duration: 0.55, stagger: 0.15 }, t0 + 0.9);
  // 关注按钮自动按下
  tl.to("#ofe-btn", { scale: 0.92, duration: 0.12, ease: "power2.in" }, t0 + 2.0);
  tl.to("#ofe-btn", { scale: 1, duration: 0.35, ease: "back.out(3)" }, t0 + 2.12);
  tl.add(function () { document.getElementById("ofe-btn-text").textContent = "已关注 ✓"; }, t0 + 2.12);
  tl.to("#ofe-btn", { background: "linear-gradient(135deg, #2ea36f, #46d390)",
    boxShadow: "0 14px 40px rgba(70,211,144,.4)", duration: 0.3 }, t0 + 2.12);
  tl.fromTo("#ofe-ring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.7, duration: 0.7, ease: "power2.out" }, t0 + 2.12);
  // 预告卡 PLAY 呼吸
  tl.to("#ofe-play", { scale: 1.12, duration: 0.9, yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 2.4);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
