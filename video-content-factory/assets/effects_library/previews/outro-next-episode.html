<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #one-bg { position: absolute; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #1a1f33 0%, #0c101c 58%, #070a12 100%); }
  #one-watermark { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    font-size: 320px; font-weight: 900; letter-spacing: 18px; color: transparent;
    -webkit-text-stroke: 2px rgba(122,150,200,.10); white-space: nowrap; }
  #one-kicker { position: absolute; left: 50%; top: 250px; transform: translateX(-50%);
    color: #ffb224; font-size: 26px; font-weight: 800; letter-spacing: 12px; }
  #one-title { position: absolute; left: 50%; top: 330px; transform: translateX(-50%);
    color: #f4f7ff; font-size: 72px; font-weight: 900; letter-spacing: 2px; white-space: nowrap; }
  #one-points { position: absolute; left: 50%; top: 500px; transform: translateX(-50%);
    display: flex; gap: 50px; }
  .one-point { color: #aab6cc; font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 14px; }
  .one-point::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #ffb224; }
  #one-bar-track { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
    width: 720px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); }
  #one-bar { position: absolute; left: 0; top: 0; height: 100%; width: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #ffb224, #ff8a3c); transform-origin: 0 50%; }
  #one-bar-dot { position: absolute; right: -7px; top: 50%; width: 18px; height: 18px; margin-top: -9px;
    border-radius: 50%; background: #ffd58a; box-shadow: 0 0 22px #ffb224; }
  #one-bar-label { position: absolute; left: 50%; bottom: 105px; transform: translateX(-50%);
    color: #8c97ad; font-size: 21px; font-weight: 700; letter-spacing: 3px; }


</style>
</head>
<body>
<div id="stage">
<div id="one-bg" data-layout-allow-overflow></div>
<div id="one-watermark" data-layout-ignore>NEXT</div>
<div id="one-kicker">下期预告 · NEXT EPISODE</div>
<div id="one-title">让 Agent 自己管自己：自动巡检 + 自动修复实战</div>
<div id="one-points">
  <div class="one-point">巡检任务怎么编排？</div>
  <div class="one-point">出错了谁来兜底？</div>
</div>
<div id="one-bar-track"><div id="one-bar"><div id="one-bar-dot" data-layout-ignore></div></div></div>
<div id="one-bar-label">每周五更新 · 不见不散</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  tl.from("#one-bg", { autoAlpha: 0, duration: 0.6 }, t0);
  tl.from("#one-watermark", { autoAlpha: 0, scale: 1.3, duration: 1.0, ease: "power3.out" }, t0 + 0.2);
  tl.from("#one-kicker", { autoAlpha: 0, y: -20, duration: 0.45 }, t0 + 0.5);
  var oneSplit = new SplitText("#one-title", { type: "chars" });
  tl.from(oneSplit.chars, { autoAlpha: 0, y: 34, duration: 0.5, stagger: 0.022, ease: "back.out(1.6)" }, t0 + 0.7);
  tl.from(".one-point", { autoAlpha: 0, x: -30, duration: 0.45, stagger: 0.18 }, t0 + 1.5);
  tl.from(["#one-bar-track", "#one-bar-label"], { autoAlpha: 0, y: 20, duration: 0.4 }, t0 + 1.9);
  tl.fromTo("#one-bar", { scaleX: 0 }, { scaleX: 1, duration: 3.4, ease: "none" }, t0 + 2.1);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
