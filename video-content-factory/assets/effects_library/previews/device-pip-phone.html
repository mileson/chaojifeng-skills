<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  /* ===== B4 device-pip-phone 手机样机画中画 ===== */
  #b4-phone { position: absolute; top: 50px; right: 96px; width: 430px; height: 905px;
    border-radius: 64px; background: #0c0d12; border: 9px solid #23252e;
    box-shadow: 0 0 0 2.5px #46d390, 0 0 44px rgba(70,211,144,.5), 0 36px 90px rgba(0,0,0,.6); overflow: hidden; }
  #b4-island { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 118px; height: 32px; border-radius: 18px; background: #000; z-index: 3; }
  #b4-status { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 14px 30px 0; color: #fff; font-size: 16px; font-weight: 700; }
  #b4-head { height: 54px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; font-size: 18px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,.08); }
  #b4-head .on { width: 8px; height: 8px; border-radius: 50%; background: #46d390; }
  #b4-view { position: absolute; top: 112px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  #b4-msgs { position: absolute; left: 0; right: 0; top: 0; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; }
  .b4-msg { max-width: 78%; padding: 12px 16px; border-radius: 16px; font-size: 16.5px; line-height: 1.5; }
  .b4-bot { align-self: flex-start; background: #1d2029; color: #e8eaf0; border: 1px solid rgba(255,255,255,.09); border-bottom-left-radius: 5px; }
  .b4-me { align-self: flex-end; background: #2e6b4f; color: #eafff4; border-bottom-right-radius: 5px; }
  .b4-code { align-self: flex-start; max-width: 88%; background: #11131a; border: 1px solid rgba(70,211,144,.35); color: #46d390;
    font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; padding: 11px 14px; border-radius: 12px; }
  #b4-label { position: absolute; left: 56px; top: 430px; background: rgba(8,10,16,.8); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 16px 22px; }
  #b4-label .t { color: #fff; font-size: 30px; font-weight: 900; }
  #b4-label .s { color: #8b8d98; font-size: 16px; font-weight: 600; margin-top: 6px; }


</style>
</head>
<body>
<div id="stage">
<div id="b4" class="clip beat" data-start="20" data-duration="6" data-track-index="0" data-layout-allow-overflow>
    <div id="b4-phone" data-layout-ignore>
      <div id="b4-island"></div>
      <div id="b4-status"><span>9:41</span><span>5G ▮▮▮</span></div>
      <div id="b4-head"><div class="on"></div>Fable Agent · 正在输入</div>
      <div id="b4-view">
        <div id="b4-msgs">
          <div class="b4-msg b4-me">帮我跑一下今天的成本统计</div>
          <div class="b4-msg b4-bot">好的！正在调用成本统计 skill，读取今天的 API 用量——</div>
          <div class="b4-code">terminal: "sqlite3 ~/.fable/usage.db SELECT…"</div>
          <div class="b4-msg b4-bot">今天一共调用 47 次，总花费 ¥9.4，平均每次 ¥0.2</div>
          <div class="b4-msg b4-me">两毛钱？没算错？</div>
          <div class="b4-code">verify: tokens_in 18.2k · tokens_out 3.1k ✓</div>
          <div class="b4-msg b4-bot">没错，官方按量计费 + prompt 缓存命中，就是两毛</div>
          <div class="b4-msg b4-bot">要不要我把统计报表定时推到你手机？</div>
        </div>
      </div>
    </div>
    <div id="b4-label"><div class="t">手机样机画中画</div><div class="s">PHONE PIP · 聊天流自动滚动</div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  // tl 为主 timeline（paused + window.__timelines 注册），t0 为节拍起点秒，挂载时按工程调整
  /* ===== B4 手机样机画中画（20 起） ===== */
  (function () {
    var t0 = 0.4;
    tl.from("#b4-phone", { autoAlpha: 0, y: 50, scale: 0.92, duration: 0.65, transformOrigin: "center center" }, t0);
    tl.from("#b4-label", { autoAlpha: 0, x: -26, duration: 0.45 }, t0 + 0.4);
    tl.from(".b4-msg, .b4-code", { autoAlpha: 0, y: 16, duration: 0.35, stagger: 0.28, ease: "power2.out" }, t0 + 0.7);
    tl.to("#b4-msgs", { y: -300, duration: 1.8, ease: "power1.inOut" }, t0 + 3.0);
    tl.to(["#b4-phone", "#b4-label"], { autoAlpha: 0, y: 40, duration: 0.45, ease: "power2.in" }, t0 + 5.4);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
