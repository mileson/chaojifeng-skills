<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #otr-bg { position: absolute; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #16233a 0%, #0b121e 58%, #070b13 100%); }
  #otr-kicker { position: absolute; left: 50%; top: 140px; transform: translateX(-50%);
    color: #46d390; font-size: 24px; font-weight: 800; letter-spacing: 8px; }
  #otr-title { position: absolute; left: 50%; top: 192px; transform: translateX(-50%);
    color: #f4f7ff; font-size: 56px; font-weight: 900; }
  #otr-list { position: absolute; left: 50%; top: 360px; transform: translateX(-50%); width: max-content;
    display: flex; flex-direction: column; gap: 56px; }
  .otr-item { display: flex; align-items: center; gap: 38px; }
  .otr-num { width: 84px; height: 84px; border-radius: 20px; flex: 0 0 auto; display: flex;
    align-items: center; justify-content: center; font-size: 36px; font-weight: 900; color: #0a1410;
    background: linear-gradient(135deg, #46d390, #2ea36f);
    box-shadow: 0 14px 40px rgba(70,211,144,.28); }
  .otr-text { color: #f0f5ff; font-size: 36px; font-weight: 800; text-shadow: 0 2px 14px rgba(0,0,0,.55); }
  .otr-text small { display: block; color: #9aa8c0; font-size: 21px; font-weight: 600; margin-top: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #otr-cta { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    color: #cdd6e6; font-size: 27px; font-weight: 800; white-space: nowrap;
    text-shadow: 0 2px 12px rgba(0,0,0,.55); }
  #otr-cta b { color: #46d390; }


</style>
</head>
<body>
<div id="stage">
<div id="otr-bg" data-layout-allow-overflow></div>
<div id="otr-kicker">TAKEAWAYS · 这期记住 3 件事</div>
<div id="otr-title">花 1 分钟，把方法带走</div>
<div id="otr-list">
  <div class="otr-item"><div class="otr-num">01</div>
    <div class="otr-text">开口先问场景，再谈模型<small>九成成本浪费在「用大模型干小事」</small></div></div>
  <div class="otr-item"><div class="otr-num">02</div>
    <div class="otr-text">缓存命中率是第一指标<small>Prompt Caching 一项就能省一半</small></div></div>
  <div class="otr-item"><div class="otr-num">03</div>
    <div class="otr-text">批量任务全部走 Batch<small>不着急的活，半价排队就行</small></div></div>
</div>
<div id="otr-cta">下期继续拆 AI 省钱套路，<b>关注不迷路</b></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  tl.from("#otr-bg", { autoAlpha: 0, duration: 0.6 }, t0);
  tl.from(["#otr-kicker", "#otr-title"], { autoAlpha: 0, y: 24, duration: 0.5, stagger: 0.12 }, t0 + 0.35);
  document.querySelectorAll(".otr-item").forEach(function (item, i) {
    var at = t0 + 1.0 + i * 1.1;
    tl.from(item, { autoAlpha: 0, y: 40, duration: 0.5, ease: "back.out(1.4)" }, at);
    tl.from(item.querySelector(".otr-num"), { rotationX: -90, transformOrigin: "50% 100%",
      duration: 0.5, ease: "back.out(1.8)" }, at + 0.1);
  });
  tl.from("#otr-cta", { autoAlpha: 0, y: 24, duration: 0.5 }, t0 + 4.6);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
