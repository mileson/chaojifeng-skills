<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ocr-bg { position: absolute; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #141b2c 0%, #0a0f1a 58%, #06080f 100%); }
  #ocr-head { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); text-align: center; }
  #ocr-kicker { color: #b388ff; font-size: 22px; font-weight: 800; letter-spacing: 8px; }
  #ocr-title { color: #f4f7ff; font-size: 48px; font-weight: 900; margin-top: 10px; }
  #ocr-viewport { position: absolute; left: 50%; top: 270px; transform: translateX(-50%);
    width: 900px; height: 620px; overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 86%, transparent 100%); }
  #ocr-roll { position: absolute; left: 0; top: 0; width: 100%; text-align: center; }
  .ocr-group { margin-bottom: 64px; }
  .ocr-role { color: #8b96ac; font-size: 22px; font-weight: 700; letter-spacing: 6px; }
  .ocr-name { color: #eef2fb; font-size: 40px; font-weight: 900; margin-top: 10px; letter-spacing: 1px; }
  .ocr-name small { color: #6f7a90; font-size: 22px; font-weight: 600; margin-left: 14px; }


</style>
</head>
<body>
<div id="stage">
<div id="ocr-bg" data-layout-allow-overflow></div>
<div id="ocr-head">
  <div id="ocr-kicker">BEHIND THE SCENES</div>
  <div id="ocr-title">本期工具链</div>
</div>
<div id="ocr-viewport" data-layout-allow-overflow>
  <div id="ocr-roll">
    <div class="ocr-group"><div class="ocr-role">脚本 / 文案</div>
      <div class="ocr-name">Claude Fable 5<small>口播稿 + 分镜</small></div></div>
    <div class="ocr-group"><div class="ocr-role">B-Roll 特效</div>
      <div class="ocr-name">Hyperframes<small>HTML + GSAP 渲染</small></div></div>
    <div class="ocr-group"><div class="ocr-role">配图 / 封面</div>
      <div class="ocr-name">GPT Image<small>原生图像生成</small></div></div>
    <div class="ocr-group"><div class="ocr-role">剪辑 / 字幕</div>
      <div class="ocr-name">FFmpeg + Whisper<small>全自动流水线</small></div></div>
    <div class="ocr-group"><div class="ocr-role">出品</div>
      <div class="ocr-name">超级峰<small>一个人 + AI</small></div></div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  tl.from("#ocr-bg", { autoAlpha: 0, duration: 0.6 }, t0);
  tl.from(["#ocr-kicker", "#ocr-title"], { autoAlpha: 0, y: 22, duration: 0.5, stagger: 0.12 }, t0 + 0.35);
  // 名单从视口下缘外滚到上缘外
  tl.fromTo("#ocr-roll", { y: 640 }, { y: -780, duration: 7.5, ease: "none" }, t0 + 0.9);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
