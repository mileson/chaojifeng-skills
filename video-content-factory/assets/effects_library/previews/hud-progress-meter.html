<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  /* ===== B8 hud-progress-meter ===== */
  #b8-wrap { position: absolute; top: 64px; left: 56px; background: rgba(8,10,16,.8); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.45); padding: 26px 32px; }
  #b8-chip { display: flex; align-items: center; gap: 10px; }
  #b8-bar { width: 4px; height: 18px; background: #46d390; border-radius: 2px; }
  #b8-en { color: #46d390; font-size: 19px; font-weight: 800; letter-spacing: 4px; }
  #b8-title { color: #fff; font-size: 38px; font-weight: 900; margin-top: 12px; }
  #b8-title em { color: #46d390; font-style: normal; }
  #b8-meter { margin-top: 24px; width: 420px; }
  #b8-lb { color: #8b8d98; font-size: 16px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; }
  #b8-pct { color: #46d390; font-variant-numeric: tabular-nums; }
  #b8-track { height: 14px; border-radius: 7px; background: rgba(255,255,255,.12); overflow: hidden; }
  #b8-fill { height: 100%; width: 100%; border-radius: 7px; background: linear-gradient(90deg, #1d7a4f, #46d390); transform-origin: left center; box-shadow: 0 0 18px rgba(70,211,144,.6); }
  #b8-chips { margin-top: 22px; display: flex; gap: 12px; }
  .b8-c { padding: 8px 18px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.3); color: #e8eaf0; font-size: 17px; font-weight: 700; background: rgba(8,10,16,.6); }


</style>
</head>
<body>
<div id="stage">
<div id="b8" class="clip beat" data-start="45.5" data-duration="4.5" data-track-index="0" data-layout-allow-overflow>
    <div id="b8-wrap">
      <div id="b8-chip"><div id="b8-bar"></div><div id="b8-en">SELF-EVOLVING · 越用越省</div></div>
      <div id="b8-title">缓存命中率 <em>持续上涨</em></div>
      <div id="b8-meter">
        <div id="b8-lb"><span>命中率</span><span id="b8-pct">0%</span></div>
        <div id="b8-track"><div id="b8-fill"></div></div>
      </div>
      <div id="b8-chips"><div class="b8-c">自动缓存</div><div class="b8-c">零配置</div></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  // tl 为主 timeline（paused + window.__timelines 注册），t0 为节拍起点秒，挂载时按工程调整
  // 依赖的 count-up 工具：
  // function countUp(sel, end, dur, at, decimals, suffix) { var obj={v:0},el=document.querySelector(sel);
  //   tl.to(obj,{v:end,duration:dur,ease:"power1.out",onUpdate:function(){el.textContent=obj.v.toFixed(decimals||0)+(suffix||"");}},at); }

  /* ===== B8 进度条 HUD（45.5 起） ===== */
  (function () {
    var t0 = 0.4;
    tl.from("#b8-chip", { autoAlpha: 0, x: -26, duration: 0.4 }, t0);
    tl.from("#b8-title", { autoAlpha: 0, y: 18, duration: 0.45 }, t0 + 0.15);
    tl.from("#b8-meter", { autoAlpha: 0, duration: 0.35 }, t0 + 0.45);
    tl.fromTo("#b8-fill", { scaleX: 0 }, { scaleX: 0.92, duration: 1.1, ease: "power2.out" }, t0 + 0.6);
    countUp("#b8-pct", 92, 1.1, t0 + 0.6, 0, "%");
    tl.from(".b8-c", { autoAlpha: 0, y: 14, duration: 0.4, ease: "back.out(1.7)", stagger: 0.15 }, t0 + 1.7);
    tl.to("#b8-wrap", { autoAlpha: 0, x: -30, duration: 0.4, ease: "power2.in" }, t0 + 4.0);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
