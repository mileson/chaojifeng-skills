<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ce-win { position: absolute; left: 50%; top: 50%; width: 1240px; height: 720px;
    border-radius: 18px; background: #1e1e2e; border: 1px solid rgba(255,255,255,.14); overflow: hidden;
    box-shadow: 0 0 0 2px rgba(62,158,255,.35), 0 40px 110px rgba(0,0,0,.65); }
  #ce-titlebar { height: 46px; background: #181825; display: flex; align-items: center; padding: 0 18px; gap: 8px; }
  .ce-dot { width: 13px; height: 13px; border-radius: 50%; }
  #ce-tab { margin-left: 22px; background: #1e1e2e; border-top: 2px solid #3e9eff; color: #cdd6f4;
    font-size: 15px; padding: 10px 24px 9px; font-family: ui-monospace, Menlo, monospace; }
  #ce-body { display: flex; height: calc(100% - 46px); }
  #ce-gutter { width: 64px; padding: 22px 0; text-align: center; color: #45475a; font-size: 17px;
    font-family: ui-monospace, Menlo, monospace; line-height: 2.1; background: #181825; }
  #ce-code { flex: 1; padding: 22px 28px; font-family: ui-monospace, Menlo, monospace; font-size: 19px; line-height: 2.1; }
  .ce-line { white-space: pre; color: #cdd6f4; }
  .ce-kw { color: #cba6f7; } .ce-fn { color: #89b4fa; } .ce-str { color: #a6e3a1; } .ce-cm { color: #6c7086; } .ce-num { color: #fab387; }


</style>
</head>
<body>
<div id="stage">
<div id="ce-win">
  <div id="ce-titlebar">
    <div class="ce-dot" style="background:#ff5f57"></div><div class="ce-dot" style="background:#febc2e"></div><div class="ce-dot" style="background:#28c840"></div>
    <div id="ce-tab">【文件名.py】</div>
  </div>
  <div id="ce-body">
    <div id="ce-gutter">1<br/>2<br/>3<br/>4<br/>5</div>
    <div id="ce-code">
      <div class="ce-line" id="ce-l1"></div>
      <div class="ce-line" id="ce-l2"></div>
      <div class="ce-line" id="ce-l3"></div>
      <div class="ce-line" id="ce-l4"></div>
      <div class="ce-line" id="ce-l5"></div>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline();
  gsap.set("#ce-win", { xPercent: -50, yPercent: -50 });
  const LINES = [
    { id: "#ce-l1", html: '<span class="ce-cm"># 【注释：要做什么】</span>' },
    { id: "#ce-l2", html: '<span class="ce-kw">from</span> 【模块】 <span class="ce-kw">import</span> 【对象】' },
    { id: "#ce-l3", html: '【变量】 = 【对象】.<span class="ce-fn">【方法】</span>()' },
    { id: "#ce-l4", html: '<span class="ce-fn">print</span>(<span class="ce-str">f"【输出模板】"</span>)' },
    { id: "#ce-l5", html: '<span class="ce-cm"># 输出 → 【结论】 ✓</span>' },
  ];
  b.from("#ce-win", { autoAlpha: 0, y: 60, scale: 0.95, duration: 0.6, ease: "power3.out" }, 0);
  LINES.forEach((L, li) => {
    const el = document.querySelector(L.id);
    const st = { n: 0 };
    const tmp = document.createElement("div"); tmp.innerHTML = L.html;
    const plain = tmp.textContent;
    b.to(st, {
      n: plain.length, duration: Math.max(0.5, plain.length * 0.035), ease: "none",
      onUpdate() { el.textContent = plain.slice(0, Math.floor(st.n)); },
      onComplete() { el.innerHTML = L.html; },
    }, 0.7 + li * 0.85);
  });
  b.to("#ce-win", { autoAlpha: 0, y: 40, duration: 0.45, ease: "power2.in" }, 5.4);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
