<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ft-scrim { position: absolute; inset: 0; background: rgba(4,5,8,.62); }
  #ft-stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 1240px; height: 760px; }
  #ft-svg { position: absolute; inset: 0; overflow: visible; }
  .ft-node { position: absolute; border-radius: 14px; padding: 18px 26px; text-align: center;
    box-shadow: 0 16px 44px rgba(0,0,0,.45); }
  .ft-node .t { font-size: 23px; font-weight: 900; }
  .ft-node .s { font-size: 14px; font-weight: 700; margin-top: 3px; opacity: .75; }
  #ft-n0 { left: 440px; top: 30px; background: #ffd866; color: #1a1a1a; transform: rotate(-1.5deg); }
  #ft-n1 { left: 150px; top: 300px; background: #fff; color: #1a1a1a; transform: rotate(1deg); }
  #ft-n2 { left: 740px; top: 300px; background: #fff; color: #1a1a1a; transform: rotate(-1deg); }
  #ft-n3 { left: 620px; top: 560px; background: #46d390; color: #06281a; transform: rotate(1.2deg); }
  #ft-n4 { left: 950px; top: 560px; background: #2a2d38; color: #aab; transform: rotate(-1deg); }
  .ft-edge-label { position: absolute; background: rgba(8,10,16,.85); color: #cfd2dc; border: 1px solid rgba(255,255,255,.2);
    border-radius: 99px; font-size: 15px; font-weight: 800; padding: 5px 16px; }


</style>
</head>
<body>
<div id="stage">
<div id="ft-scrim"></div>
<div id="ft-stage">
  <svg id="ft-svg" viewBox="0 0 1240 760">
    <path id="ft-e1" d="M 560,130 C 480,200 360,240 280,295" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="4" stroke-linecap="round"/>
    <path id="ft-e2" d="M 680,130 C 760,200 820,240 860,295" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="4" stroke-linecap="round"/>
    <path id="ft-e3" d="M 840,400 C 800,460 760,500 730,555" fill="none" stroke="rgba(70,211,144,.8)" stroke-width="5" stroke-linecap="round"/>
    <path id="ft-e4" d="M 940,400 C 980,460 1010,500 1030,555" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <div class="ft-node" id="ft-n0"><div class="t">【根问题】</div><div class="s">START HERE</div></div>
  <div class="ft-node" id="ft-n1"><div class="t">【分支A】</div><div class="s">【说明】</div></div>
  <div class="ft-node" id="ft-n2"><div class="t">【分支B】</div><div class="s">【说明】</div></div>
  <div class="ft-node" id="ft-n3"><div class="t">✓ 【推荐方案】</div><div class="s">【关键数字】</div></div>
  <div class="ft-node" id="ft-n4"><div class="t">【备选方案】</div><div class="s">【关键数字】</div></div>
  <div class="ft-edge-label" id="ft-lb1" style="left:330px;top:200px">【条件A】</div>
  <div class="ft-edge-label" id="ft-lb2" style="left:790px;top:200px">【条件B】</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline();
  b.from("#ft-scrim", { autoAlpha: 0, duration: 0.4 }, 0);
  ["#ft-e1", "#ft-e2", "#ft-e3", "#ft-e4"].forEach((sel) => {
    const p = document.querySelector(sel);
    const len = p.getTotalLength();
    gsap.set(p, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } });
  });
  b.from("#ft-n0", { autoAlpha: 0, scale: 0.5, duration: 0.5, ease: "back.out(1.8)" }, 0.2);
  b.to(["#ft-e1", "#ft-e2"], { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut", stagger: 0.15 }, 0.8);
  b.from(["#ft-lb1", "#ft-lb2"], { autoAlpha: 0, scale: 0.5, duration: 0.35, ease: "back.out(2)", stagger: 0.15 }, 1.0);
  b.from(["#ft-n1", "#ft-n2"], { autoAlpha: 0, scale: 0.5, duration: 0.5, ease: "back.out(1.8)", stagger: 0.18 }, 1.2);
  b.to(["#ft-e3", "#ft-e4"], { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut", stagger: 0.15 }, 2.1);
  b.from(["#ft-n3", "#ft-n4"], { autoAlpha: 0, scale: 0.5, duration: 0.5, ease: "back.out(1.8)", stagger: 0.18 }, 2.5);
  b.to("#ft-n3", { boxShadow: "0 0 0 5px rgba(70,211,144,.7), 0 16px 44px rgba(0,0,0,.45)", duration: 0.35, yoyo: true, repeat: 3 }, 3.4);
  b.to("#ft-scrim", { autoAlpha: 0, duration: 0.45, ease: "power2.in" }, 5.4);
  b.to("#ft-stage", { autoAlpha: 0, duration: 0.45, ease: "power2.in" }, 5.4);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
