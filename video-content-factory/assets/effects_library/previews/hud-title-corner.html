<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  /* ===== B1 hud-title-corner 常驻标题 HUD ===== */
  #b1-wrap { position: absolute; top: 48px; left: 56px; background: rgba(8,10,16,.8); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.45); padding: 26px 32px; }
  #b1-chip { display: flex; align-items: center; gap: 10px; }
  #b1-bar { width: 4px; height: 18px; background: #3e9eff; border-radius: 2px; }
  #b1-en { color: #3e9eff; font-size: 20px; font-weight: 800; letter-spacing: 5px; }
  #b1-cn { color: #cfd2dc; font-size: 18px; font-weight: 600; letter-spacing: 2px; }
  #b1-title { color: #fff; font-size: 56px; font-weight: 900; letter-spacing: 2px; margin-top: 10px; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  #b1-line { width: 220px; height: 3px; margin-top: 10px; border-radius: 2px; background: linear-gradient(90deg, #3e9eff, rgba(62,158,255,0)); transform-origin: left center; }
  #b1-sub { color: #8b8d98; font-size: 19px; font-weight: 600; letter-spacing: 3px; margin-top: 10px; }
  #b1-list { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
  .b1-item { display: flex; align-items: center; gap: 12px; }
  .b1-dot { width: 10px; height: 10px; border-radius: 50%; }
  .b1-item .t { color: #fff; font-size: 22px; font-weight: 700; }
  .b1-item .e { color: #8b8d98; font-size: 12px; font-weight: 700; letter-spacing: 2px; margin-top: 1px; }


</style>
</head>
<body>
<div id="stage">
<div id="b1" class="clip beat" data-start="0.5" data-duration="5.5" data-track-index="0" data-layout-allow-overflow>
    <div id="b1-wrap">
      <div id="b1-chip"><div id="b1-bar"></div><div id="b1-en">LIVE · AI AGENT</div><div id="b1-cn">成本实测 · 实时演示</div></div>
      <div id="b1-title">Fable 5</div>
      <div id="b1-line"></div>
      <div id="b1-sub">两毛钱一次 SKILL</div>
      <div id="b1-list">
        <div class="b1-item" id="b1-i1"><div class="b1-dot" style="background:#3e9eff"></div><div><div class="t">官方 API 按量计费</div><div class="e">PAY AS YOU GO</div></div></div>
        <div class="b1-item" id="b1-i2"><div class="b1-dot" style="background:#46d390"></div><div><div class="t">单次成本 ¥0.2</div><div class="e">COST DOWN</div></div></div>
        <div class="b1-item" id="b1-i3"><div class="b1-dot" style="background:#ffb224"></div><div><div class="t">效果不打折</div><div class="e">FULL POWER</div></div></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  // tl 为主 timeline（paused + window.__timelines 注册），t0 为节拍起点秒，挂载时按工程调整
  /* ===== B1 常驻标题 HUD（0.5 起） ===== */
  (function () {
    var t0 = 0.4;
    tl.from("#b1-chip", { autoAlpha: 0, x: -30, duration: 0.45 }, t0);
    tl.from("#b1-title", { autoAlpha: 0, y: 22, duration: 0.5 }, t0 + 0.12);
    tl.fromTo("#b1-line", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, t0 + 0.3);
    tl.from("#b1-sub", { autoAlpha: 0, y: 14, duration: 0.4 }, t0 + 0.42);
    tl.from(["#b1-i1", "#b1-i2", "#b1-i3"], { autoAlpha: 0, x: -24, duration: 0.45, ease: "back.out(1.6)", stagger: 0.9 }, t0 + 1.2);
    tl.to("#b1-wrap", { autoAlpha: 0, x: -30, duration: 0.4, ease: "power2.in" }, t0 + 5.0);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
