<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  /* ===== B2 hud-step-checklist 步骤编号+渐进清单 ===== */
  #b2-wrap { position: absolute; top: 48px; left: 56px; background: rgba(8,10,16,.8); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.45); padding: 26px 32px; }
  #b2-head { display: flex; align-items: baseline; gap: 16px; }
  #b2-num { color: #3e9eff; font-size: 72px; font-weight: 900; line-height: 1; text-shadow: 0 0 28px rgba(62,158,255,.5); }
  #b2-meta .k { color: #8b8d98; font-size: 13px; font-weight: 800; letter-spacing: 3px; }
  #b2-meta .t { color: #fff; font-size: 34px; font-weight: 900; letter-spacing: 2px; margin-top: 2px; }
  #b2-chips { margin-top: 28px; display: flex; flex-direction: column; gap: 18px; }
  .b2-chip { display: flex; align-items: center; gap: 14px; }
  .b2-ico { width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(62,158,255,.16); border: 1px solid rgba(62,158,255,.45); }
  .b2-chip .zh { color: #fff; font-size: 22px; font-weight: 800; }
  .b2-chip .en { color: #8b8d98; font-size: 12px; font-weight: 700; letter-spacing: 2px; margin-top: 1px; }


</style>
</head>
<body>
<div id="stage">
<div id="b2" class="clip beat" data-start="6.5" data-duration="6.5" data-track-index="0" data-layout-allow-overflow>
    <div id="b2-wrap">
      <div id="b2-head">
        <div id="b2-num">01</div>
        <div id="b2-meta"><div class="k">CORE STEP · 01 / 04</div><div class="t">成本拆解</div></div>
      </div>
      <div id="b2-chips">
        <div class="b2-chip" id="b2-c1"><div class="b2-ico">💰</div><div><div class="zh">官方价格 → 实付价格</div><div class="en">PRICE BREAKDOWN</div></div></div>
        <div class="b2-chip" id="b2-c2"><div class="b2-ico">📊</div><div><div class="zh">按 Token 算到每一次调用</div><div class="en">PER-CALL COST</div></div></div>
        <div class="b2-chip" id="b2-c3"><div class="b2-ico">✅</div><div><div class="zh">两毛钱 · 验证可复现</div><div class="en">REPRODUCIBLE</div></div></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  // tl 为主 timeline（paused + window.__timelines 注册），t0 为节拍起点秒，挂载时按工程调整
  /* ===== B2 步骤编号+渐进清单（6.5 起，chip 随口播追加） ===== */
  (function () {
    var t0 = 0.4;
    tl.from("#b2-num", { autoAlpha: 0, scale: 0.5, duration: 0.55, ease: "back.out(2)" }, t0);
    tl.from("#b2-meta", { autoAlpha: 0, x: -24, duration: 0.45 }, t0 + 0.15);
    tl.from("#b2-c1", { autoAlpha: 0, x: -26, duration: 0.45, ease: "back.out(1.7)" }, t0 + 0.9);
    tl.from("#b2-c2", { autoAlpha: 0, x: -26, duration: 0.45, ease: "back.out(1.7)" }, t0 + 2.4);
    tl.from("#b2-c3", { autoAlpha: 0, x: -26, duration: 0.45, ease: "back.out(1.7)" }, t0 + 3.9);
    tl.to("#b2-c3 .b2-ico", { scale: 1.18, duration: 0.3, ease: "power2.inOut", yoyo: true, repeat: 1 }, t0 + 4.5);
    tl.to("#b2-wrap", { autoAlpha: 0, x: -30, duration: 0.4, ease: "power2.in" }, t0 + 6.0);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
